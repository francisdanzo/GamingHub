<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GamingHub — Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="particles" id="particles" aria-hidden="true"></div>

  <!-- ══ HEADER ══ -->
  <header>
    <a href="/index.html" class="logo" aria-label="GamingHub accueil">
      <svg class="logo-icon" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="34" height="34" rx="8" fill="url(#logo-grad-c)"/>
        <path d="M17 7v10M12 12h10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="22" cy="22" r="2.5" fill="#F43F5E"/>
        <circle cx="27" cy="22" r="2.5" fill="rgba(255,255,255,.4)"/>
        <circle cx="22" cy="27" r="2.5" fill="rgba(255,255,255,.4)"/>
        <defs>
          <linearGradient id="logo-grad-c" x1="0" y1="0" x2="34" y2="34">
            <stop offset="0%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#4C1D95"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="logo-text">GamingHub</span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="mainNav">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>

    <nav id="mainNav" role="navigation" aria-label="Navigation principale">
      <a href="/index.html">Accueil</a>
      <a href="/jeux.html">Jeux</a>
      <a href="/index.html#features">À propos</a>
      <a href="/jeux.html" class="nav-cta">Jouer maintenant</a>
    </nav>
  </header>

  <!-- ══ CONTACT ══ -->
  <main class="contact-section" aria-labelledby="contact-title">
    <div class="section-header">
      <span class="section-tag">Support &amp; Feedback</span>
      <h1 class="section-title" id="contact-title">Contactez-nous</h1>
      <p class="section-sub">
        Une question, une suggestion ou un bug à signaler&nbsp;? On vous répond dans les plus brefs délais.
      </p>
    </div>

    <div class="contact-form-card">
      <form class="contact-form" action="#" method="post" novalidate>

        <div class="form-group">
          <label class="form-label" for="name">Nom</label>
          <input
            class="form-input"
            type="text"
            id="name"
            name="name"
            placeholder="Votre nom"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Adresse e-mail</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="vous@exemple.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="subject">Sujet</label>
          <input
            class="form-input"
            type="text"
            id="subject"
            name="subject"
            placeholder="Bug, suggestion, question…"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Message</label>
          <textarea
            class="form-textarea"
            id="message"
            name="message"
            placeholder="Décrivez votre demande en détail…"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-primary form-submit">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 8h10M9 5l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Envoyer le message
        </button>

      </form>
    </div>
  </main>

  <!-- ══ FOOTER ══ -->
  <footer>
    <div class="footer-inner">
      <a href="/index.html" class="footer-logo">GamingHub</a>
      <p class="footer-copy">&copy; 2025 GamingHub — Tous droits réservés</p>
      <nav class="footer-links" aria-label="Liens du pied de page">
        <a href="/index.html">Accueil</a>
        <a href="/jeux.html">Jeux</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    const toggle = document.getElementById('navToggle');
    const nav = document.getElementById('mainNav');
    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
  </script>
</body>
</html>
